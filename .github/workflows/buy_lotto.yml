name: Buy lotto
on:
  schedule:
    - cron: 0 10 * * 1 # every Monday on 07:00 PM (KST)
  workflow_dispatch:

jobs:
  build:
    # 동행복권이 해외(GitHub 호스티드 러너) IP 접속을 차단/지연하므로 한국 IP의 self-hosted runner에서 실행
    runs-on: [self-hosted, korea]
    timeout-minutes: 20
    name: Buy lotto
    steps:  

      - uses: actions/checkout@v3    
      - name: Set up Python venv
        run: |
          PY=$(command -v python3.9 || echo /opt/homebrew/bin/python3.9)
          HASH=$(shasum requirements.txt | cut -c1-12)
          VENV="$HOME/.cache/lottery-bot-venv-$HASH"
          if [ ! -x "$VENV/bin/python" ]; then
            rm -rf "$VENV.tmp"
            "$PY" -m venv "$VENV.tmp"
            "$VENV.tmp/bin/pip" install -q -r requirements.txt
            mv "$VENV.tmp" "$VENV"
          fi
          echo "$VENV/bin" >> "$GITHUB_PATH"
      
      - name: Run Scripts
        run: make buy # or use 'make buy_lotto' / 'make buy_win720' for granular purchase
        env:
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          COUNT: ${{ secrets.COUNT }}
          BALANCE_THRESHOLD: ${{ secrets.BALANCE_THRESHOLD }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL:  ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Notify on failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL not set, skipping failure notification"
            exit 0
          fi
          payload=$(jq -nc \
            --arg content "🚨 워크플로우 실패: **${WORKFLOW}**\n${RUN_URL}" \
            '{content: $content}')
          curl -fsS -X POST -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK_URL"